name: SchoolsFirst FCU
kind: company
description: >-
  SchoolsFirst Federal Credit Union is a federally chartered, member-owned credit
  union headquartered in Tustin, California, serving educators and their families.
  Founded in 1934 as Orange County Teachers Credit Union, it is the largest credit
  union in California and one of the largest in the United States, with roughly
  $31.9 billion in assets, over 1.4 million members, and about 70 branches. It
  offers savings, checking, loans, mortgages, credit cards, and investment
  services. Like most US credit unions, SchoolsFirst runs no first-party public
  developer program: probes of developer.schoolsfirstfcu.org fail to resolve and
  /developers returns 404, and its api.schoolsfirstfcu.org host is the member
  online-banking login backend, not a documented API. Consumer-permissioned data
  access is available only through open-finance aggregators (Plaid, Finicity, MX,
  Akoya) rather than a direct API. No public FDX participation or CFPB Section 1033
  data-access posture is documented at this time.
